  --bg:#090d0b; --card:#111714; --ink:#edf3ef; --muted:#93a29a; --line:#1e2823;
  --accent:#34d399; --accent-ink:#7fe3bb; --accent-soft:#0f2c22;
  --teal:#38bdf8; --teal-soft:#0e2a3a;
  --green:#34d399; --green-soft:#0f2c22; --red:#f87171; --red-soft:#3a1d1f;
  --amber:#fbbf24; --amber-soft:#3a2c12;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom));}
svg{display:block;}
header#topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 18px 10px;border-bottom:1px solid var(--line);}
header#topbar .trow{display:flex;align-items:center;justify-content:space-between;}
header#topbar h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;}
header#topbar h1 .logo{display:inline-flex;width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#0b9e6d,#0ea5e9);color:#fff;align-items:center;justify-content:center;margin-right:9px;}
header#topbar p{margin:3px 0 0;color:var(--muted);font-size:12.5px;}
#monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 6px;box-shadow:var(--shadow);}
#monthnav button{border:0;background:none;color:var(--ink);padding:4px 9px;border-radius:999px;cursor:pointer;font-family:inherit;display:flex;align-items:center;}
#monthnav button:active{background:var(--accent-soft);}
#m-label{font-size:13px;font-weight:700;text-transform:capitalize;min-width:104px;text-align:center;}
#m-today{display:none;font-size:11px;font-weight:700;color:var(--accent);border:0;background:var(--accent-soft);border-radius:999px;padding:5px 10px;margin-left:6px;cursor:pointer;font-family:inherit;}
main{padding:14px 14px 0;}
.view{display:none;}
.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid color-mix(in srgb, var(--line) 60%, transparent);}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 svg{color:var(--accent);}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.muted{color:var(--muted);}
.small{font-size:13px;}
.big{font-size:33px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;}
.secttl{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:18px 2px 8px;}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px;}
.delta-up{color:var(--red);font-weight:700;}
.delta-down{color:var(--green);font-weight:700;}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.amt.pos{color:var(--green);}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.pill.ok{background:var(--green-soft);color:var(--green);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.pill.info{background:var(--accent-soft);color:var(--accent);}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s;}
.bar > i.ok{background:var(--green);} .bar > i.warn{background:var(--amber);} .bar > i.bad{background:var(--red);}
.kpi{display:flex;gap:10px;margin:10px 0;}
.kpi .k{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.kpi .k .l{font-size:11.5px;color:var(--muted);font-weight:600;}
.kpi .k .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
.tip{border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:8px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);}
.tip.warn{background:var(--amber-soft);border-color:color-mix(in srgb, var(--amber) 25%, transparent);}
.tip.good{background:var(--green-soft);border-color:color-mix(in srgb, var(--green) 22%, transparent);}
/* hero */
.hero{border-radius:24px;padding:20px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#0b9e6d 0%,#0ea5e9 100%);box-shadow:0 8px 24px rgba(11,158,109,.35);position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);}
.hero .hlab{font-size:12.5px;font-weight:600;opacity:.88;text-transform:capitalize;display:flex;align-items:center;gap:6px;}
.hero .hbig{font-size:38px;font-weight:800;letter-spacing:-.8px;margin:2px 0 10px;font-variant-numeric:tabular-nums;}
.hero .hrow{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:6px;opacity:.95;}
.hero .hbar{height:9px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden;}
.hero .hbar > i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s;}
.hero .hpill{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;margin-top:10px;}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%;font-family:inherit;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:var(--accent-soft);color:var(--accent);}
.btn.danger{background:var(--red-soft);color:var(--red);}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:11px;}
.btn svg{flex:none;}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:11px 13px;font-size:15px;font-family:inherit;margin-bottom:10px;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.amount-big{font-size:34px;font-weight:800;text-align:center;padding:14px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:6px;}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;}
.seg button.sel{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.seg button.sel.exp{color:var(--red);}
.seg button.sel.inc{color:var(--green);}
.voicebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:13px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:4px;font-family:inherit;}
.voicebtn.listening{border-color:var(--red);color:var(--red);background:var(--red-soft);}
.switch{position:relative;width:46px;height:27px;flex:none;}
.switch input{opacity:0;width:0;height:0;margin:0;}
.switch .sl{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer;}
.switch .sl::before{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .sl{background:var(--green);}
.switch input:checked + .sl::before{transform:translateX(19px);}
.checkline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;cursor:pointer;}
.checkline:last-child{border-bottom:0;}
.checkline input{width:auto;margin:0;accent-color:var(--accent);}
/* lists */
.exp{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:default;}
.exp:last-child{border-bottom:0;}
.exp .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;}
.exp .tx{flex:1;min-width:0;}
.exp .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.exp .tx span{font-size:12px;color:var(--muted);}
.exp .del{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px;opacity:.55;font-family:inherit;}
.exp .del:active{opacity:1;color:var(--red);}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:11px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.iconbtn.danger{color:var(--red);}
.iconbtn:active{transform:scale(.95);}
.menurow{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;font-size:15px;}
.menurow:last-child{border-bottom:0;}
.menurow .mi{width:40px;height:40px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.menurow .chev{margin-left:auto;color:var(--muted);display:flex;}
.menurow .sub{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:10px;color:var(--muted);}
.searchbar input{border:0;margin:0;padding:0;background:none;}
.searchbar input:focus{border:0;}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.fchip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);}
/* categories */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.catchip{border:1.5px solid var(--line);border-radius:13px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;}
.catchip.sel{border-color:var(--accent);background:var(--accent-soft);}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.legbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-family:inherit;}
.legbtn:active{transform:scale(.95);background:var(--accent-soft);}
.legbtn i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
.catchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch;}
.catchips .catchip{flex:none;min-width:66px;}
.cathead{display:flex;align-items:center;gap:14px;margin:2px 0 8px;}
.cathead .big-ic{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;}
.cathead h2{margin:0;font-size:20px;}
.backlink{color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;border:0;background:none;padding:0;margin-bottom:8px;font-family:inherit;display:inline-flex;align-items:center;gap:2px;}
.tagchip{display:inline-flex;align-items:center;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;}
/* tabbar / fab / sheets */
nav#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb, var(--card) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30;}
.tab{flex:1;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit;}
.tab.active{color:var(--accent);}
#fab{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#0b9e6d,#0ea5e9);color:#fff;align-self:center;margin:0 6px;cursor:pointer;box-shadow:0 6px 18px rgba(11,158,109,.45);display:flex;align-items:center;justify-content:center;}
#fab:active{transform:scale(.93);}
.sheet{position:fixed;inset:0;z-index:50;display:none;}
.sheet.open{display:block;}
.sheet .scrim{position:absolute;inset:0;background:rgba(10,14,12,.5);}
.sheet .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;animation:up .22s ease;}
@keyframes up{from{transform:translate(-50%,30px);opacity:.6;}to{transform:translate(-50%,0);opacity:1;}}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px;}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px;}
.sheet h2 svg{color:var(--accent);}
/* misc */
.qa{display:flex;gap:10px;margin-bottom:12px;}
.qa button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;}
.qa button:active{background:var(--accent-soft);}
.qa button svg{color:var(--accent);}
.goalbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;}
.goalbar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0b9e6d,#0ea5e9);}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.statgrid .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
.statgrid .stat .l{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;}
.statgrid .stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;}
.cal .d{padding:7px 0;border-radius:9px;color:var(--muted);}
.cal .d.has{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.cal .d.up{background:var(--amber-soft);color:var(--amber);font-weight:700;}
.cal .d.wd{font-weight:800;color:var(--muted);padding:4px 0;}
.filelabel{display:block;border:1.5px dashed var(--line);border-radius:13px;padding:12px;text-align:center;font-weight:700;color:var(--accent);cursor:pointer;margin-bottom:8px;font-size:14px;}
.filelabel input{display:none;}
.streak{display:flex;align-items:center;gap:12px;}
.streak .flame{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.scorewrap{display:flex;align-items:center;gap:16px;}
.settle{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.settle:last-child{border-bottom:0;}
.settle .who{flex:1;font-weight:600;}
.settle .amt{color:var(--accent);}
.logrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted);}
.logrow:last-child{border-bottom:0;}
.logrow b{font-variant-numeric:tabular-nums;}
.simresult{border-radius:14px;padding:13px;font-size:14.5px;font-weight:600;margin-top:10px;}
.simresult.yes{background:var(--green-soft);color:var(--green);}
.simresult.no{background:var(--red-soft);color:var(--red);}
.debt-actions{display:flex;gap:8px;margin-top:10px;}
.debt-actions .iconbtn{flex:1;justify-content:center;padding:9px;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="trow">
      <h1><span class="logo" id="applogo"></span>Bolsillo</h1>
      <div style="display:flex;align-items:center;">
        <div id="monthnav">
          <button id="m-prev" aria-label="Mes anterior"></button>
          <button id="m-label"></button>
          <button id="m-next" aria-label="Mes siguiente"></button>
        </div>
        <button id="m-today">Hoy</button>
      </div>
    </div>
    <p id="topsub">Tu dinero, bajo control</p>
  </header>
  <main>
    <section id="view-inicio" class="view active"></section>
    <section id="view-mov" class="view"></section>
    <section id="view-informes" class="view"></section>
    <section id="view-mas" class="view"></section>
  </main>
  <nav id="tabbar">
    <button class="tab active" data-v="inicio"><span class="ti" data-ic="home"></span>Inicio</button>
    <button class="tab" data-v="mov"><span class="ti" data-ic="list"></span>Movimientos</button>
    <button id="fab" aria-label="Añadir movimiento"></button>
    <button class="tab" data-v="informes"><span class="ti" data-ic="chart"></span>Informes</button>
    <button class="tab" data-v="mas"><span class="ti" data-ic="dots"></span>Más</button>
  </nav>
</div>

<div class="sheet" id="sheet-add">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="grab"></div>
    <h2 id="add-title">Nuevo movimiento</h2>
    <div class="seg" id="add-seg">
      <button data-t="exp" class="sel exp">Gasto</button>
      <button data-t="inc" class="inc">Ingreso</button>
    </div>
    <input id="f-amount" class="amount-big" inputmode="decimal" placeholder="0,00 €" autocomplete="off">
    <button class="voicebtn" id="btn-voice">Dictar por voz <span class="small muted">· "12 euros de menú"</span></button>
    <div id="voice-msg" class="small muted" style="text-align:center;margin:-4px 0 8px;min-height:18px;"></div>
    <div id="f-expfields">
      <label class="lbl">Categoría</label>
      <div class="catgrid" id="f-cats"></div>
    </div>
    <div id="f-incfields" style="display:none;">
      <label class="lbl">Origen del ingreso</label>
      <input id="f-source" placeholder="Nómina, freelance, venta…" maxlength="40">
      <div class="fchips" id="f-inccats"></div>
    </div>
    <label class="lbl" id="f-notelbl">Nota <span class="muted" style="text-transform:none;letter-spacing:0;">· puedes usar #etiquetas</span></label>
    <input id="f-note" placeholder="¿En qué fue? (opcional)" maxlength="60">
    <div class="row" style="gap:10px;">
      <div style="flex:1;"><label class="lbl">Fecha</label><input id="f-date" type="date"></div>
      <div style="flex:1;" id="f-tripwrap"><label class="lbl">Viaje (opcional)</label><select id="f-trip"><option value="">— Ninguno —</option></select></div>
    </div>
    <label class="checkline" id="f-refundwrap"><input type="checkbox" id="f-refund"> Pendiente de devolución</label>
    <button class="btn" id="btn-save-exp">Guardar</button>
  </div>
</div>

<div class="sheet" id="sheet-cat">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="cat-detail"></div></div>
</div>

<div class="sheet" id="sheet-modal">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="modal-body"></div></div>
</div>

<div class="sheet" id="sheet-goal">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="goal-body"></div></div>
</div>

<div class="sheet" id="sheet-debt">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="debt-body"></div></div>
</div>

<div class="sheet" id="sheet-group">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="group-body"></div></div>
</div>
<script>
/* Iconos SVG del sistema (stroke 1.8, 24x24) */

  let s = String(str).toLowerCase().replace(/€|euros?/g,'').trim().replace(',','.');

  while(!hasExp(dstr(d)) && guard<365){ n++; d=new Date(d.getTime()-864e5); guard++; }
  return n;
}

function blankState(){
  return { expenses:[], incomes:[], budgets:{}, rollover:{}, carried:{}, carriedMk:"",
    recurring:[], debts:[], groups:[], trips:[], goals:[], rules:[],
    streak:{best:0}, customCats:[],
    settings:{salary:1500, salaryDay:1, salaryAuto:true, dark:false}, seeded:false };

function save(){ localStorage.setItem(LSKEY, JSON.stringify(S)); }
function load(){
  try{ S = JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ S=null; }
  if(!S || !S.seeded){ S = blankState(); seed(); S.seeded = true; save(); }
  if(!Array.isArray(S.incomes)) S.incomes=[];
  if(!Array.isArray(S.goals)) S.goals=[];
  if(!Array.isArray(S.groups)) S.groups=[];
  if(!Array.isArray(S.rules)) S.rules=[];
  if(!Array.isArray(S.customCats)) S.customCats=[];
  if(!S.streak || typeof S.streak!=="object") S.streak={best:0};
  if(!S.budgets) S.budgets={}; if(!S.rollover) S.rollover={}; if(!S.carried) S.carried={};
  if(!S.settings || typeof S.settings!=="object") S.settings={salary:1500,salaryDay:1,salaryAuto:true,dark:false};
  if(typeof S.settings.salary!=="number") S.settings.salary=1500;
  if(typeof S.settings.salaryDay!=="number") S.settings.salaryDay=1;
  if(typeof S.settings.salaryAuto!=="boolean") S.settings.salaryAuto=true;
  if(typeof S.settings.dark!=="boolean") S.settings.dark=false;
  S.debts.forEach(d=>{ if(!Array.isArray(d.log)) d.log=[]; if(typeof d.settled!=="boolean") d.settled=false; });
  S.recurring.forEach(r=>{ if(r.day==null) r.day=null; });
  S.expenses.forEach(e=>{ if(typeof e.refund!=="boolean") e.refund=false; });
}
function seed(){
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const notes={comida:["Menú del día #uni","Supermercado","Cena con amigos #ocio","Café","Mercado"],transporte:["Metro","Gasolina","Taxi","Parking"],ocio:["Cine","Concierto","Videojuegos","Teatro"],compras:["Ropa","Zapatillas","Regalo","Librería"],hogar:["Luz","Internet","Limpieza"],salud:["Farmacia","Dentista","Fisio"],otros:["Varios"]};
  const now=new Date();
  for(let m=3;m>=0;m--){
    const d0=new Date(now.getFullYear(), now.getMonth()-m, 1);
    const days = m===0 ? now.getDate() : new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
    const n = Math.floor(rnd(22,34));
    for(let i=0;i<n;i++){
      const cat = pick(["comida","comida","comida","transporte","transporte","ocio","compras","hogar","salud","otros"]);
      const day = 1+Math.floor(Math.random()*days);
      const dt = new Date(d0.getFullYear(), d0.getMonth(), Math.min(day,days));
      if(dt>now) continue;
      const base={comida:14,transporte:9,ocio:22,compras:45,hogar:60,salud:18,otros:12}[cat];
      S.expenses.push({id:uid(), amount:Math.round(rnd(base*0.4,base*2.2)*100)/100, cat, note:pick(notes[cat]), date:dstr(dt), tripId:"", refund:false});
    }
    if(m>0) S.incomes.push({id:uid(), amount:Math.round(rnd(80,320)*100)/100, cat:"extra", source:pick(["Freelance","Venta Wallapop","Extra"]), note:"", date:dstr(new Date(d0.getFullYear(),d0.getMonth(),15))});
  }
  S.budgets = {comida:320, transporte:120, ocio:150, compras:200, hogar:180, salud:80, otros:60};
  S.recurring = [
    {id:uid(), name:"Netflix", amount:13.99, cat:"susc", day:7},

    {id:uid(), name:"Gimnasio", amount:35, cat:"salud", day:1},

  S.debts = [

    {id:uid(), person:"Javi", amount:25, type:"owe", note:"Entradas", settled:false, log:[{d:todayStr(),a:25,k:"add"}]},
  ];
  S.trips = [{id:uid(), name:"Lisboa 4 días", budget:600, start:"2026-11-06", end:"2026-11-09"}];
  S.expenses.push({id:uid(), amount:89, cat:"viajes", note:"Vuelo ida", date:todayStr(), tripId:S.trips[0].id, refund:false});
  S.goals = [

    {id:uid(), name:"iPhone nuevo", target:1319, saved:150, deadline:"", color:"#8b5cf6"},
  ];
  S.rules = [{id:uid(), match:"mercadona", cat:"comida"}];
  S.groups = [];
}
/* Rollover: arrastra lo no gastado al mes siguiente (si la categoría lo tiene activo) */
function ensureCarried(){
  const cur=monthKey(todayStr());
  if(S.carriedMk===cur) return;
  const pd=new Date(); pd.setMonth(pd.getMonth()-1);
  const pmk=pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0");
  const spent={}; monthExpenses(pmk).forEach(e=>spent[e.cat]=(spent[e.cat]||0)+e.amount);
  S.carried={};
  Object.keys(S.rollover).forEach(cat=>{ if(S.rollover[cat]) S.carried[cat]=Math.round(((S.budgets[cat]||0)-(spent[cat]||0))*100)/100; });
  S.carriedMk=cur; save();
}

function donutSVG(data, size){

  });

    <text x="75" y="70" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">${fmt0(total)}</text>

}
function barsSVG(labels, values, color){

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

    s+=`<rect x="${x.toFixed(1)}" y="${(H-h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" rx="3" fill="var(--green)"/>
        <rect x="${(x+w).toFixed(1)}" y="${(H-h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="3" fill="var(--red)"/>
        <text x="${(x+bw/2-7).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${lb}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>
  <div class="row small" style="margin-top:6px;"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--green);margin-right:5px;"></i>Ingresos</span>
  <span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--red);margin-right:5px;"></i>Gastos</span></div>`;
}
function sparkline(values, color){
  const W=260,H=64,max=Math.max(...values,1),min=Math.min(...values,0);
  const rng=(max-min)||1, n=values.length;
  const pts=values.map((v,i)=>`${(i/(n-1||1)*W).toFixed(1)},${(H-6-((v-min)/rng)*(H-14)).toFixed(1)}`).join(" ");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:64px;">
    <polyline points="${pts}" fill="none" stroke="${color||"var(--accent)"}" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${color||"var(--accent)"}" opacity="0.12"/></svg>`;
}
function scoreRing(score){
  const R=34, C=2*Math.PI*R, col=score>=70?"var(--green)":score>=40?"var(--amber)":"var(--red)";
  return `<svg width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(score/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)">${score}</text></svg>`;
}

/* Score financiero 0-100 */
function finScore(mk){
  const exps=monthExpenses(mk), total=sumExp(exps), inc=monthIncomeTotal(mk);
  const sr=inc>0?(inc-total)/inc:0;
  let sc=0; const tips=[];
  const sPts = sr>=0.2?40 : sr>=0.1?25 : sr>=0?12 : 0;
  sc+=sPts;
  if(sPts<40) tips.push(sr<0?"Gastas más de lo que ingresas: tu score se hunde.":"Sube tu tasa de ahorro al 20% para ganar hasta 40 puntos.");
  const bcats=Object.keys(S.budgets).filter(c=>(S.budgets[c]||0)>0);
  let bPts=15;
  if(bcats.length){ const ok=bcats.filter(c=>(byCat(exps).find(d=>d.cat===c)||{total:0}).total<=S.budgets[c]).length; bPts=Math.round(25*ok/bcats.length);
    if(ok<bcats.length) tips.push(`Cumple todos tus presupuestos (+${25-bPts} pts).`); }
  sc+=bPts;
  const st=currentStreak(), stPts=Math.min(10,st);
  sc+=stPts;
  if(stPts<10) tips.push("Encadena días sin gastar: cada día suma 1 punto (máx. 10).");
  const emg=S.goals.find(g=>/emergencia|colch[oó]n|fondo/i.test(g.name));
  let ePts=0;
  if(emg&&emg.target>0){ ePts=Math.round(15*Math.min(1,emg.saved/emg.target)); if(ePts<15) tips.push("Aporta a tu fondo de emergencia (+15 pts)."); }
  else tips.push("Crea un fondo de emergencia: vale hasta 15 puntos.");
  sc+=ePts;
  const dPts = S.debts.some(d=>!d.settled&&d.type==="owe"&&d.amount>0) ? 0 : 10;
  sc+=dPts;
  if(!dPts) tips.push("Liquida lo que debes: son 10 puntos.");
  return {score:Math.min(100,Math.round(sc)), tips:tips.slice(0,3)};
}
/* Proyección día a día hasta fin de mes */
function forecast(mk){
  const [Y,M]=mk.split("-").map(Number);
  const isCur=mk===monthKey(todayStr());
  const dim=new Date(Y,M,0).getDate();
  const startDay=isCur?new Date().getDate():dim;
  const inc=monthIncomeTotal(mk), spent=sumExp(monthExpenses(mk));
  const daysElapsed=isCur?Math.max(1,new Date().getDate()):dim;
  const avg=spent/daysElapsed;
  const up=upcomingRecurring(mk);
  const vals=[]; let v=inc-spent;
  for(let d=startDay; d<=dim; d++){
    v-=avg;
    up.forEach(r=>{ if(r.day===d) v-=r.amount; });
    vals.push(Math.round(v*100)/100);
  }
  return {vals, end:vals.length?vals[vals.length-1]:inc-spent, avg};
}

/* ================= INFORMES ================= */
function renderInformes(){
  const mk=viewMk, Y=+mk.slice(0,4), M=+mk.slice(5,7);
  const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(Y, M-1-i, 1); months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const labels=months.map(m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleString("es-ES",{month:"short"}));
  const vals=months.map(m=>sumExp(monthExpenses(m)));
  const ivals=months.map(m=>monthIncomeTotal(m));
  const srVals=months.map((m,i)=>ivals[i]>0?Math.max(0,Math.round((ivals[i]-vals[i])/ivals[i]*100)):0);

  // calendario: gastado + próximos cargos
  const first=new Date(Y,M-1,1), startDay=(first.getDay()+6)%7, dim=new Date(Y,M,0).getDate();
  const byDay={}; monthExpenses(mk).forEach(e=>{const d=+e.date.slice(8,10); byDay[d]=(byDay[d]||0)+e.amount;});
  const upDays={}; upcomingRecurring(mk).forEach(r=>{ if(r.day) upDays[r.day]=(upDays[r.day]||0)+r.amount; });
  let cells=["L","M","X","J","V","S","D"].map(w=>`<div class="d wd">${w}</div>`).join("");
  for(let i=0;i<startDay;i++) cells+=`<div class="d"></div>`;
  for(let d=1;d<=dim;d++){
    const cls=byDay[d]?"has":(upDays[d]?"up":"");
    const tt=byDay[d]?fmt(byDay[d]):(upDays[d]?"cargo previsto: "+fmt(upDays[d]):"");
    cells+=`<div class="d ${cls}" title="${tt}">${d}</div>`;
  }

  const prevK=months[4];
  const prev={}; byCat(monthExpenses(prevK)).forEach(d=>prev[d.cat]=d.total);
  const comp=byCat(monthExpenses(mk)).slice(0,6).map(d=>{
    const c=catById(d.cat), p=prev[d.cat]||0, chg=p>0?(d.total-p)/p*100:100;
    return `<div class="exp" data-cat="${d.cat}" style="cursor:pointer">${catBadge(c)}
      <div class="tx"><b>${c.name}</b><span>mes anterior: ${fmt(p)}</span></div>
      <div class="amt ${chg>0?"delta-up":"delta-down"}">${chg>0?"+":""}${chg.toFixed(0)}%</div></div>`;
  }).join("");

  const merch={}; monthExpenses(mk).forEach(e=>{ const k=(e.note||"").replace(/#[\p{L}\d_]+/gu,"").trim(); if(k) merch[k]=(merch[k]||0)+e.amount; });
  const topM=Object.entries(merch).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,t],i)=>
    `<div class="exp"><div class="ic" style="background:var(--accent-soft);color:var(--accent);font-weight:800;">${i+1}</div>
      <div class="tx"><b>${esc(n)}</b></div><div class="amt">−${fmt(t)}</div></div>`).join("");

  const wd=[0,0,0,0,0,0,0], wdl=["L","M","X","J","V","S","D"];
  monthExpenses(mk).forEach(e=>{ const d=new Date(e.date+"T12:00:00"); if(!isNaN(d)) wd[(d.getDay()+6)%7]+=e.amount; });

  // año en curso
  const ym=[]; for(let m=1;m<=12;m++) ym.push(Y+"-"+String(m).padStart(2,"0"));
  const yvals=ym.map(m=>sumExp(monthExpenses(m)));
  const ytot=yvals.reduce((a,b)=>a+b,0);
  const ymlabels=["E","F","M","A","M","J","J","A","S","O","N","D"];

  // 50/30/20
  const need=sumExp(expsOfCats(mk,NEEDS)), want=sumExp(expsOfCats(mk,WANTS));
  const inc=monthIncomeTotal(mk);
  const pNeed=inc>0?need/inc*100:0, pWant=inc>0?want/inc*100:0, pSave=inc>0?(inc-sumExp(monthExpenses(mk)))/inc*100:0;

  // ahorro acumulado histórico
  const mks=[...new Set(S.expenses.map(e=>monthKey(e.date)).concat(S.incomes.map(e=>monthKey(e.date))))].sort();
  const accum=mks.reduce((a,m)=>a+monthBalance(m),0);

  $("#view-informes").innerHTML=`
    <div class="card"><h3>${icon("wallet",16)} Flujo de caja · últimos 6 meses</h3>${barsDual(labels, ivals, vals)}
      <div class="row small" style="margin-top:8px;"><span class="muted">Balance 6 meses</span><b style="color:${ivals.reduce((a,b)=>a+b,0)-vals.reduce((a,b)=>a+b,0)>=0?"var(--green)":"var(--red)"}">${fmtSigned(ivals.reduce((a,b)=>a+b,0)-vals.reduce((a,b)=>a+b,0))}</b></div></div>
    <div class="card"><h3>${icon("trendUp",16)} Tasa de ahorro % · 6 meses</h3>${barsSVG(labels, srVals, "var(--green)")}
      <div class="small muted">Porcentaje de tus ingresos que no gastas cada mes.</div></div>
    <div class="card"><h3>${icon("pie",16)} Regla 50/30/20 · <span style="text-transform:capitalize;">${monthLabel(mk).split(" ")[0]}</span></h3>
      ${ruleRow("Necesidades", pNeed, 50, "var(--teal)")}
      ${ruleRow("Caprichos", pWant, 30, "var(--violet)")}
      ${ruleRow("Ahorro", Math.max(0,pSave), 20, "var(--green)")}
      <div class="small muted" style="margin-top:6px;">Necesidades: comida, transporte, hogar y salud. Caprichos: ocio, compras, viajes y suscripciones.</div></div>
    <div class="card"><h3>${icon("calendar",16)} Calendario · <span style="text-transform:capitalize;">${monthLabel(mk)}</span></h3><div class="cal">${cells}</div>
      <div class="row small muted" style="margin-top:8px;"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent-soft);margin-right:4px;border:1px solid var(--accent);"></i>gastado</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--amber-soft);margin-right:4px;border:1px solid var(--amber);"></i>cargo previsto</span></div></div>
    <div class="secttl">Comparativa por categoría</div>
    <div class="card">${comp||'<div class="empty">Sin datos.</div>'}</div>
    <div class="secttl">Dónde gastas más</div>
    <div class="card">${topM||'<div class="empty">Añade notas a tus gastos para verlo.</div>'}</div>
    <div class="card"><h3>${icon("calendar",16)} Gasto por día de semana</h3>${barsSVG(wdl, wd, "var(--violet)")}</div>
    <div class="card"><h3>${icon("chart",16)} Resumen ${Y}</h3>${barsSVG(ymlabels, yvals, "var(--accent)")}
      <div class="kpi"><div class="k"><div class="l">Total año</div><div class="v">${fmt0(ytot)}</div></div>
      <div class="k"><div class="l">Media/mes</div><div class="v">${fmt0(ytot/12)}</div></div></div>
      <div class="row small"><span class="muted">Mejor mes</span><b style="color:var(--green)">${ymlabels[yvals.indexOf(Math.min(...yvals))]||"—"}</b></div>
      <div class="row small"><span class="muted">Peor mes</span><b style="color:var(--red)">${ymlabels[yvals.indexOf(Math.max(...yvals))]||"—"}</b></div></div>
    <div class="card"><div class="row"><h3 style="margin:0;">${icon("banknote",16)} Ahorro acumulado</h3><b class="big" style="font-size:24px;color:${accum>=0?"var(--green)":"var(--red)"}">${fmtSigned(accum)}</b></div>
      <div class="small muted">Suma de todos tus balances mensuales desde que usas la app.</div></div>`;
  bindCatDetail("#view-informes");
}
function expsOfCats(mk, cats){ return monthExpenses(mk).filter(e=>cats.includes(e.cat)); }
function ruleRow(label, pct, target, color){
  const ok=pct<=target||label==="Ahorro"&&pct>=target;
  const good = label==="Ahorro" ? pct>=target : pct<=target;
  return `<div style="margin-bottom:10px;"><div class="row small"><span>${label}</span><b>${pct.toFixed(0)}% <span class="muted">/ ideal ${target}%</span></b></div>
    <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${color};"></i></div>
    <div class="small ${good?"":"muted"}" style="color:${good?"var(--green)":"var(--amber)"};">${good?"En objetivo ✓":"Desviado: "+(label==="Ahorro"?"te falta "+(target-pct).toFixed(0)+" pts":"te pasas "+(pct-target).toFixed(0)+" pts")}</div></div>`;
}

/* ================= VIAJES ================= */
function renderViajes(sub){
  const el=$("#view-mas");
  if(sub && sub.trip){
    const t=S.trips.find(x=>x.id===sub.trip); if(!t){ renderViajes(); return; }
    const exps=S.expenses.filter(e=>e.tripId===t.id).sort((a,b)=>b.date.localeCompare(a.date));
    const total=sumExp(exps);
    const d0=new Date(t.start+"T12:00:00"), d1=new Date(t.end+"T12:00:00");
    const days=Math.max(1,Math.round((d1-d0)/864e5)+1);
    const today=new Date(); today.setHours(0,0,0,0);
    const elapsed=Math.min(days,Math.max(0,Math.round((today-d0)/864e5)+1));
    const perDay=t.budget/days, spentPerDay=elapsed>0?total/elapsed:0;
    const pct=Math.min(100,t.budget>0?total/t.budget*100:0);
    el.innerHTML=`
      <button class="backlink" id="v-back">${icon("chevL",14)} Viajes</button>
      <div class="card">
        <h3>${icon("plane",16)} ${esc(t.name)}</h3>
        <div class="small muted">${t.start} → ${t.end} · ${days} días</div>
        <div class="big" style="margin-top:8px;">${fmt(total)}</div>
        <div class="small muted">de ${fmt(t.budget)} de presupuesto</div>
        <div class="bar"><i class="${pct>90?"bad":pct>70?"warn":"ok"}" style="width:${pct}%"></i></div>
        <div class="kpi" style="margin-top:12px;">
          <div class="k"><div class="l">Previsto/día</div><div class="v">${fmt0(perDay)}</div></div>
          <div class="k"><div class="l">Real/día</div><div class="v">${fmt0(spentPerDay)}</div></div>
          <div class="k"><div class="l">Quedan</div><div class="v">${fmt0(t.budget-total)}</div></div>
        </div>
        ${spentPerDay>perDay?`<div class="tip warn">Vas <b>${fmt0(spentPerDay-perDay)}/día</b> por encima del ritmo previsto.</div>`:`<div class="tip good">Vas dentro del ritmo previsto. ¡Sigue así!</div>`}
      </div>
      <div class="row" style="margin:4px 2px 8px;"><span class="secttl" style="margin:0;">Gastos del viaje</span>
        <button class="btn sm" id="v-add">+ Añadir</button></div>
      <div class="card">${exps.map(e=>expRow(e,true)).join("")||'<div class="empty">Sin gastos en este viaje.</div>'}</div>
      <button class="btn danger" id="v-del" style="margin-top:4px;">Eliminar viaje</button>`;
    bindDel("#view-mas");
    $("#v-back").onclick=()=>renderMas("viajes");
    $("#v-add").onclick=()=>openAdd({tripId:t.id});
    $("#v-del").onclick=()=>{
      if(confirm("¿Eliminar el viaje? Sus gastos pasarán al mes general.")){
        S.expenses.forEach(e=>{ if(e.tripId===t.id) e.tripId=""; });
        S.trips=S.trips.filter(x=>x.id!==t.id); save(); renderMas("viajes");
      }
    };
    return;
  }
  const cards=S.trips.map(t=>{
    const total=sumExp(S.expenses.filter(e=>e.tripId===t.id));
    const pct=Math.min(100,t.budget>0?total/t.budget*100:0);
    return `<div class="card" data-trip="${t.id}" style="cursor:pointer;">
      <div class="row"><b style="display:flex;align-items:center;gap:8px;">${icon("plane",18)} ${esc(t.name)}</b><span class="pill ${pct>90?"bad":pct>70?"warn":"ok"}">${Math.round(pct)}%</span></div>
      <div class="small muted">${t.start} → ${t.end}</div>
      <div class="bar"><i class="${pct>90?"bad":pct>70?"warn":"ok"}" style="width:${pct}%"></i></div>
      <div class="row small" style="margin-top:6px;"><span class="muted">${fmt(total)} de ${fmt(t.budget)}</span><span style="color:var(--muted);display:flex;">${icon("chevR",16)}</span></div>
    </div>`;
  }).join("");
  el.innerHTML=`
    <button class="backlink" id="v-back2">${icon("chevL",14)} Más</button>
    <div class="card"><h3>${icon("plane",16)} Modo viaje</h3>
      <div class="small muted" style="margin-bottom:10px;">Presupuesto aparte para tus viajes: no se mezcla con las cuentas del mes.</div>
      <button class="btn" id="btn-newtrip">+ Nuevo viaje</button></div>
    ${cards||'<div class="empty">Aún no tienes viajes.<br>Crea el primero para empezar.</div>'}`;
  $("#v-back2").onclick=()=>renderMas();
  $("#btn-newtrip").onclick=()=>modalTrip();
  el.querySelectorAll("[data-trip]").forEach(c=>c.onclick=()=>renderViajes({trip:c.dataset.trip}));
}
function modalTrip(){
  openModal(`
    <h2>${icon("plane",18)} Nuevo viaje</h2>
    <label class="lbl">Nombre</label><input id="t-name" placeholder="p. ej. Lisboa 4 días" maxlength="40">
    <div class="row" style="gap:10px;">
      <div style="flex:1;"><label class="lbl">Inicio</label><input id="t-start" type="date" value="${todayStr()}"></div>
      <div style="flex:1;"><label class="lbl">Fin</label><input id="t-end" type="date" value="${todayStr()}"></div>

    <label class="lbl">Presupuesto total (€)</label><input id="t-budget" inputmode="decimal" placeholder="600">
    <button class="btn" id="t-save">Crear viaje</button>`);

    const name=$("#t-name").value.trim()||"Mi viaje";
    const budget=parseAmount($("#t-budget").value)||0;
    S.trips.push({id:uid(), name, budget, start:$("#t-start").value||todayStr(), end:$("#t-end").value||todayStr()});

}

function goalMove(gid, dir){
  const g=S.goals.find(x=>x.id===gid); if(!g) return;
  openModal(`<h2>${dir>0?"+ Añadir a":"− Retirar de"} ${esc(g.name)}</h2>
    <div class="small muted" style="margin-bottom:8px;">Llevas ${fmt(g.saved)} de ${fmt(g.target)}.</div>
    <label class="lbl">Importe (€)</label><input id="gm-amount" inputmode="decimal" placeholder="50">
    <button class="btn" id="gm-save">${dir>0?"Añadir":"Retirar"}</button>`);
  $("#gm-save").onclick=()=>{ const a=parseAmount($("#gm-amount").value);
    if(a>0){ g.saved=Math.max(0, Math.round((g.saved+dir*a)*100)/100); save(); } closeModal(); renderMas("obj"); rerender(); };
}

function upsertDebt(person, type, amount, note){
  person=(person||"").trim()||"Alguien";
  let d=S.debts.find(x=>!x.settled&&x.person.toLowerCase()===person.toLowerCase()&&x.type===type);
  if(d){ d.amount=Math.round((d.amount+amount)*100)/100; d.log.push({d:todayStr(),a:Math.round(amount*100)/100,k:"add",n:note||""}); }
  else { d={id:uid(),person,amount:Math.round(amount*100)/100,type,note:note||"",settled:false,log:[{d:todayStr(),a:Math.round(amount*100)/100,k:"add",n:note||""}]}; S.debts.push(d); }
  save(); return d;
}

  const el=$("#view-mas");
  const act=S.debts.filter(d=>!d.settled);
  const owed=act.filter(d=>d.type==="owed").reduce((a,d)=>a+d.amount,0);

  const settled=S.debts.filter(d=>d.settled);
  el.innerHTML=`
    <button class="backlink" data-back>${icon("chevL",14)} Más</button>

    <div class="k"><div class="l">Debes</div><div class="v" style="color:var(--red)">${fmt0(owe)}</div></div>
    <div class="k"><div class="l">Neto</div><div class="v" style="color:${owed-owe>=0?"var(--green)":"var(--red)"}">${fmtSigned(owed-owe)}</div></div></div>
    <div class="qa">
      <button id="btn-newdebt">${icon("plus",18)}Nueva deuda</button>

    </div>
    <div class="secttl">Activas</div>
    ${act.map(d=>`
      <div class="card" data-debt="${d.id}" style="cursor:pointer;">
        <div class="row"><b>${esc(d.person)}</b>
          <span class="pill ${d.type==="owed"?"ok":"bad"}">${d.type==="owed"?"te debe":"le debes"}</span></div>
        <div class="big" style="font-size:26px;margin:4px 0;">${fmt(d.amount)}</div>
        ${d.note?`<div class="small muted">${esc(d.note)}</div>`:""}
        <div class="debt-actions">
          <button class="iconbtn" data-dadd="${d.id}">${icon("plus",14)} Añadir</button>
          <button class="iconbtn" data-dpay="${d.id}">${icon("check",14)} ${d.type==="owed"?"Cobrar":"Pagar"}</button>
        </div>
      </div>`).join("")||'<div class="empty">Sin deudas activas. Todo en orden.</div>'}
    ${settled.length?`<div class="secttl">Saldadas</div><div class="card">${settled.map(d=>`
      <div class="exp"><div class="ic" style="background:var(--green-soft);color:var(--green);">${icon("check",18)}</div>

      <button class="del" data-ddel="${d.id}">✕</button></div>`).join("")}</div>`:""}`;
  el.querySelector("[data-back]").onclick=()=>renderMas();
  $("#btn-newdebt").onclick=()=>{
    openModal(`<h2>${icon("swap",18)} Nueva deuda</h2>
    <label class="lbl">Persona</label><input id="d-person" placeholder="Nombre" maxlength="40">

    $("#d-save").onclick=()=>{ const a=parseAmount($("#d-amount").value);
      if(a>0) upsertDebt($("#d-person").value, $("#d-type").value, a, $("#d-note").value.trim());

function openDebt(id){
  const d=S.debts.find(x=>x.id===id); if(!d) return;
  const log=d.log.slice().reverse().map(l=>`<div class="logrow"><span>${l.k==="add"?"Añadido":"Pago"} · ${fmtDay(l.d)}${l.n?" · "+esc(l.n):""}</span><b style="color:${l.k==="add"?"var(--amber)":"var(--green)"}">${l.k==="add"?"+":"−"}${fmt(l.a)}</b></div>`).join("");
  $("#debt-body").innerHTML=`
    <h2>${icon("swap",18)} ${esc(d.person)}</h2>
    <div class="row"><span class="pill ${d.type==="owed"?"ok":"bad"}">${d.type==="owed"?"Te debe":"Le debes"}${d.settled?" · saldada":""}</span>
    <b class="big" style="font-size:26px;">${fmt(d.amount)}</b></div>
    ${d.note?`<div class="small muted" style="margin:6px 0;">${esc(d.note)}</div>`:""}
    <div class="debt-actions">
      <button class="iconbtn" id="db-add">${icon("plus",14)} Añadir deuda</button>
      <button class="iconbtn" id="db-pay">${icon("check",14)} ${d.type==="owed"?"Registrar cobro":"Registrar pago"}</button>
    </div>
    <div class="secttl">Historial</div>
    <div class="card" style="margin-bottom:0;">${log||'<div class="empty">Sin movimientos.</div>'}</div>
    <button class="btn danger" id="db-del" style="margin-top:10px;">Eliminar</button>`;
  $("#sheet-debt").classList.add("open");
  $("#db-add").onclick=()=>debtMove(id,1);
  $("#db-pay").onclick=()=>debtMove(id,-1);
  $("#db-del").onclick=()=>{ if(confirm("¿Eliminar esta deuda?")){ S.debts=S.debts.filter(x=>x.id!==id); save(); closeDebtSheet(); renderDebts(); } };
}
function closeDebtSheet(){ $("#sheet-debt").classList.remove("open"); }
function debtMove(id, dir){
  const d=S.debts.find(x=>x.id===id); if(!d) return;
  const isPay=dir<0;
  openModal(`<h2>${isPay?(d.type==="owed"?"Cobrar a ":"Pagar a "):"Añadir a "} ${esc(d.person)}</h2>
    <div class="small muted" style="margin-bottom:8px;">Deuda actual: <b>${fmt(d.amount)}</b></div>
    <label class="lbl">Importe (€)</label><input id="dm-amount" inputmode="decimal" placeholder="20">
    <label class="lbl">Nota (opcional)</label><input id="dm-note" maxlength="60" placeholder="p. ej. cena del viernes">
    <button class="btn" id="dm-save">${isPay?"Registrar":"Añadir"}</button>`);
  $("#dm-save").onclick=()=>{
    const a=parseAmount($("#dm-amount").value); if(!(a>0)) return;
    const note=$("#dm-note").value.trim();
    if(isPay){
      d.amount=Math.round((d.amount-a)*100)/100;
      d.log.push({d:todayStr(),a,k:"pay",n:note});
      if(d.amount<=0.005){ d.amount=0; d.settled=true; miniToast("Deuda saldada ✓"); }
    } else {
      d.amount=Math.round((d.amount+a)*100)/100; d.settled=false;
      d.log.push({d:todayStr(),a,k:"add",n:note});
    }
    save(); closeModal();

function groupBalances(g){
  const bal={}; g.members.forEach(m=>bal[m]=0);
  g.items.forEach(it=>{
    const who=it.for.filter(m=>g.members.includes(m));
    if(!who.length) return;
    const share=it.amount/who.length;
    bal[it.payer]=(bal[it.payer]||0)+it.amount;
    who.forEach(m=>bal[m]=(bal[m]||0)-share);
  });
  return bal;
}
function settlePlan(bal){
  const cred=Object.entries(bal).filter(([_,v])=>v>0.005).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  const debt=Object.entries(bal).filter(([_,v])=>v<-0.005).map(([n,v])=>({n,v:-v})).sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0,guard=0;
  while(i<cred.length&&j<debt.length&&guard<50){ guard++;
    const a=Math.min(cred[i].v,debt[j].v);
    out.push({from:debt[j].n,to:cred[i].n,amount:Math.round(a*100)/100});
    cred[i].v-=a; debt[j].v-=a;
    if(cred[i].v<0.005)i++; if(debt[j].v<0.005)j++;
  }
  return out;
}

function guessCatFromMerchant(n){
  n=(n||"").toLowerCase();
  const has=(...ws)=>ws.some(w=>n.includes(w));
  if(has("mercadona","carrefour","lidl","aldi","consum","supermercado","mcdonald","burger king","kfc","telepizza","glovo","uber eats","just eat","starbucks","restaurante","cafeteria","cafetería","panaderia","panadería","foster","vips","dominos")) return "comida";
  if(has("uber","cabify","bolt","renfe","metro","emt","alsa","parking","repsol","cepsa","shell","gasolinera","peaje","taxi")) return "transporte";
  if(has("netflix","spotify","icloud","prime video","disney+","hbo","youtube premium","patreon","audible")) return "susc";
  if(has("cine","cinesa","yelmo","steam","playstation","xbox","nintendo","fnac","game")) return "ocio";
  if(has("amazon","shein","zara","h&m","corte ingl","ikea","mediamarkt","pccomponentes","aliexpress","primor","sephora","nike","adidas")) return "compras";
  if(has("endesa","iberdrola","naturgy","orange","vodafone","movistar","digi","o2")) return "hogar";
  if(has("farmacia","dentista","hospital","fisio","optica","óptica","clinica")) return "salud";
  if(has("vueling","ryanair","iberia","booking","airbnb","hotel","easyjet","edreams")) return "viajes";
  return "otros";
}
function importFromURL(){
  let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  const raw=q.get("add");
  if(!raw) return;
  const amount=parseAmount(raw);
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(!(amount>0)) return;
  const note=(q.get("desc")||q.get("note")||"").trim().slice(0,80);
  let cat=applyRule(note);
  if(!cat){ cat=(q.get("cat")||"").toLowerCase(); if(!allCats().some(c=>c.id===cat)) cat=guessCatFromMerchant(note); }
  S.expenses.push({id:uid(), amount:Math.round(amount*100)/100, cat, note:note||"Apple Pay", date:todayStr(), tripId:"", refund:false});
  save();
  viewMk=monthKey(todayStr()); renderTopbar(); rerender();

function advisorTips(){
  const mk=viewMk;
  const list=monthExpenses(mk), total=sumExp(list);
  const inc=monthIncomeTotal(mk), bal=inc-total, sr=inc>0?bal/inc:0;
  const p=mk.split("-"), Y=+p[0], M=+p[1];
  const _pd=new Date(Y,M-2,1); const prevK=_pd.getFullYear()+"-"+String(_pd.getMonth()+1).padStart(2,"0");
  const prev=byCat(monthExpenses(prevK)), cur=byCat(list);
  const tips=[];
  const pm={}; prev.forEach(d=>pm[d.cat]=d.total);
  let worst=null;
  cur.forEach(d=>{ const pr=pm[d.cat]||0; if(pr>5){ const ch=(d.total-pr)/pr; if(!worst||ch>worst.ch) worst={cat:d.cat,ch,now:d.total,was:pr}; }});
  if(worst&&worst.ch>0.15) tips.push(`<div class="tip warn">${icon("alert",16)} <b>${catById(worst.cat).name}</b> ha subido un <b>${Math.round(worst.ch*100)}%</b> respecto al mes pasado (${fmt0(worst.was)} → ${fmt0(worst.now)}).</div>`);
  // gasto duplicado sospechoso
  const seen={};
  list.forEach(e=>{ const k=(e.note||"").toLowerCase().trim()+"|"+e.amount.toFixed(2); (seen[k]=seen[k]||[]).push(e); });
  Object.values(seen).forEach(g=>{ if(g.length>1){ const ds=[...new Set(g.map(e=>e.date))].sort();
    if(ds.length>1){ const dd=(new Date(ds[ds.length-1])-new Date(ds[0]))/864e5;
      if(dd<=4) tips.push(`<div class="tip warn">${icon("alert",16)} Posible gasto duplicado: <b>${esc(g[0].note||"sin nota")}</b> (${fmt(g[0].amount)}) aparece ${g.length} veces en 4 días.</div>`); } } });
  // comercio disparado vs media
  const merchCur={}, merchPrev={};
  list.forEach(e=>{ const k=(e.note||"").replace(/#[\p{L}\d_]+/gu,"").trim().toLowerCase(); if(k) merchCur[k]=(merchCur[k]||0)+e.amount; });
  for(let i=1;i<=3;i++){ const d=new Date(Y,M-1-i,1); const k2=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    monthExpenses(k2).forEach(e=>{ const k=(e.note||"").replace(/#[\p{L}\d_]+/gu,"").trim().toLowerCase(); if(k) merchPrev[k]=(merchPrev[k]||0)+e.amount; }); }
  Object.entries(merchCur).forEach(([k,v])=>{ const avg=(merchPrev[k]||0)/3;
    if(avg>20 && v>avg*1.6) tips.push(`<div class="tip warn">${icon("trendUp",16)} En <b>${esc(k)}</b> llevas ${fmt(v)} este mes, muy por encima de tu media (${fmt(avg)}/mes).</div>`); });
  Object.entries(S.budgets).forEach(([c,b])=>{
    const s=(cur.find(d=>d.cat===c)||{total:0}).total, eb=effBudget(c);
    if(b>0&&s/eb>=1) tips.push(`<div class="tip warn">${icon("alert",16)} Has superado el presupuesto de <b>${catById(c).name}</b> (${fmt0(s)} de ${fmt0(eb)}).</div>`);
    else if(b>0&&s/eb>=0.85) tips.push(`<div class="tip">${icon("target",16)} <b>${catById(c).name}</b>: al ${Math.round(s/eb*100)}% del presupuesto. Quedan ${fmt0(eb-s)}.</div>`);
  });
  const rec=S.recurring.reduce((a,r)=>a+r.amount,0);
  if(rec>0) tips.push(`<div class="tip">${icon("repeat",16)} Tus suscripciones suman <b>${fmt(rec)}/mes</b> (${fmt0(rec*12)}/año).${inc>0?` Son el ${Math.round(rec/inc*100)}% de tus ingresos.`:""}</div>`);
  if(inc>0){
    if(sr<0) tips.push(`<div class="tip warn">${icon("alert",16)} Gastas <b>${fmt0(-bal)}</b> más de lo que ingresas.</div>`);
    else if(sr<0.1) tips.push(`<div class="tip warn">${icon("alert",16)} Tu tasa de ahorro es solo del <b>${Math.round(sr*100)}%</b>. El objetivo es el 20%.</div>`);
    else if(sr>=0.2) tips.push(`<div class="tip good">${icon("check",16)} Tasa de ahorro del <b>${Math.round(sr*100)}%</b> (${fmt(bal)}). Excelente.</div>`);
  } else {
    tips.push(`<div class="tip">${icon("wallet",16)} Configura tu nómina en <b>Más → Ingresos</b> para desbloquear el análisis completo.</div>`);
  }
  const refunds=S.expenses.filter(e=>e.refund);
  if(refunds.length) tips.push(`<div class="tip">${icon("upload",16)} Tienes <b>${fmt(sumExp(refunds))}</b> pendientes de devolución. No lo dejes pasar.</div>`);
  const owed=S.debts.filter(d=>!d.settled&&d.type==="owed").reduce((a,d)=>a+d.amount,0);
  if(owed>0) tips.push(`<div class="tip">${icon("swap",16)} Te deben <b>${fmt0(owed)}</b>. Recuperarlo es el "ahorro" más fácil del mes.</div>`);
  const rl=S.rules.length;
  if(!rl) tips.push(`<div class="tip">${icon("wand",16)} Crea <b>reglas inteligentes</b> en Más para que tus gastos de Apple Pay se categoricen solos.</div>`);
  if(!tips.length) tips.push(`<div class="tip good">${icon("check",16)} Todo bajo control este mes. Sin alertas.</div>`);
  return tips.slice(0,6).join("");
}

/* ================= Tema / navegación / init ================= */
function applyTheme(){
  document.documentElement.dataset.theme = S.settings.dark ? "dark" : "light";
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", S.settings.dark ? "#090d0b" : "#eef4f1");
}
function rerender(){
  renderInicio();
  if($("#view-mov").classList.contains("active")) renderMov();
  if($("#view-informes").classList.contains("active")) renderInformes();
  if($("#view-mas").classList.contains("active")) renderMas();
  if($("#sheet-cat").classList.contains("open")) renderCatDetail();
}
function go(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v));
  $("#view-"+v).classList.add("active");
  $("#topsub").textContent={inicio:"Tu dinero, bajo control",mov:"Todos tus movimientos",informes:"Calendario, tendencias y comparativas",mas:"Ajustes, objetivos y más"}[v];
  ({inicio:()=>renderInicio(),mov:()=>renderMov(),informes:()=>renderInformes(),mas:()=>renderMas()})[v]();
  window.scrollTo(0,0);
}

document.addEventListener("DOMContentLoaded",()=>{
  load();
  applyTheme();
  viewMk=monthKey(todayStr());
  $("#applogo").innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 5-3 8-8 8z"/><path d="M12 13c0-3-2.5-5-6-5 0 4 2.5 6 6 5z"/></svg>';
  document.querySelectorAll("[data-ic]").forEach(el=>{ el.innerHTML=icon(el.dataset.ic, 22); });
  $("#fab").innerHTML=icon("plus",26);
  $("#btn-voice").insertAdjacentHTML("afterbegin", icon("mic",16)+" ");
  renderTopbar();
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
  $("#fab").onclick=()=>openAdd({type:"exp"});
  $("#m-prev").onclick=()=>shiftMonth(-1);
  $("#m-next").onclick=()=>shiftMonth(1);
  $("#m-label").onclick=()=>{ viewMk=monthKey(todayStr()); renderTopbar(); rerender(); };
  $("#m-today").onclick=()=>{ viewMk=monthKey(todayStr()); renderTopbar(); rerender(); };
  document.querySelectorAll("#add-seg button").forEach(b=>b.onclick=()=>{ if(!editing){ addType=b.dataset.t; syncAddUI(); } });
  document.querySelectorAll("[data-close]").forEach(s=>s.onclick=()=>{closeAdd();closeModal();closeCatDetail();closeDebtSheet();closeGroupSheet();});
  $("#btn-save-exp").onclick=saveAdd;
  $("#btn-voice").onclick=()=>{ rec?stopVoice():startVoice(); };
  $("#f-amount").addEventListener("keydown",e=>{ if(e.key==="Enter") saveAdd(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){closeAdd();closeModal();closeCatDetail();closeDebtSheet();closeGroupSheet();} });
  renderInicio();
  importFromURL();
});
</script>
</body>
